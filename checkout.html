<!--
DESIGN NOTE — Kairozen Store full-page checkout
Mirrors baby_checkout.html's pattern (BABY TOPUP project): the KHQR payment
modal from index.html is extracted into its own page instead of an overlay,
same idea as "make it a page like the topup website" asked for.

Data handoff: index.html's proceedToPayment() (bank-payment path only —
wallet payment stays instant/in-modal since there's no QR involved) writes
order details to sessionStorage["kz_checkout_<orderId>"] and navigates here
with ?order=<orderId>. This page has its own script — it does NOT share
index.html's in-memory STATE object (impossible across a real navigation) —
so it reads/writes the same localStorage keys directly:
  kz_state2    → {products, stock, settings}
  kz_userdata  → {users, orders}
This keeps everything in sync for when the shopper navigates back to "/".
-->
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ទូទាត់ · Kairozen Store</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06080c">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#FF9F1C;--gold2:#E8890A;--bg:#0A0D16;--bg2:#10141F;--bg3:#161B2A;--bg4:#1C2235;
  --text:#F1F4FA;--text2:#8D96AC;--text3:#565F78;--green:#2DD4BF;--red:#FB5A5A;
  --border:rgba(255,159,28,0.16);--border2:rgba(255,255,255,0.07);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Khmer',sans-serif;min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;background-image:radial-gradient(ellipse at 15% -10%, rgba(245,200,66,.08), transparent 45%);}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
#page{max-width:440px;width:100%;min-height:100vh;padding:0 0 40px}

.topbar{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border2)}
.topbar a{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:13px;font-family:'Syne','Noto Sans Khmer',sans-serif}
.topbar a svg{width:15px;height:15px}

.step-track{display:flex;align-items:center;justify-content:center;gap:6px;padding:18px 20px 4px}
.step-dot{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--text3);transition:all .3s}
.step-dot.active{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#000;box-shadow:0 0 14px rgba(245,200,66,.5)}
.step-dot.done{background:var(--green);border-color:transparent;color:#fff}
.step-line{width:24px;height:1.5px;background:var(--border2);transition:background .3s}
.step-line.done{background:var(--green)}
.step-label{text-align:center;font-family:'Space Mono','Noto Sans Khmer',monospace;font-size:9.5px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding-bottom:10px}

/* ══ KHQR CARD — light card, red ribbon header (KHQR standard look) ══ */
.khqr-card{width:100%;margin-top:14px;background:#eef1f6;border-radius:20px;overflow:hidden;
  box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 0 1px rgba(245,200,66,.15);position:relative}
.khqr-header{position:relative;background:linear-gradient(135deg,#d32f2f,#8e1c1c);
  padding:20px 20px 30px;clip-path:polygon(0 0,100% 0,100% 62%,88% 100%,0 100%)}
.khqr-header-bar{width:44px;height:3px;background:rgba(255,255,255,.5);border-radius:3px;margin:0 auto 12px}
.khqr-brand{text-align:center;font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:21px;font-weight:800;color:#fff;letter-spacing:1.5px}
.khqr-brand em{font-style:normal;opacity:.92}
.khqr-title-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.khqr-title{font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:14px;font-weight:800;color:#1c2333}
.khqr-timer{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:#1c2333;cursor:pointer}
.khqr-timer-ring{width:16px;height:16px;transform:rotate(-90deg)}
.khqr-timer-ring circle{fill:none;stroke-width:2.5}
.khqr-timer-ring .bg{stroke:rgba(28,35,51,.15)}
.khqr-timer-ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.khqr-timer.expired{color:var(--red)}
.khqr-timer.expired .khqr-timer-ring .fg{stroke:var(--red)}
.khqr-merchant-bar{padding:10px 18px 0;text-align:center}
.khqr-merchant{font-family:'Noto Sans Khmer',sans-serif;font-size:12.5px;font-weight:600;color:#6b7280;letter-spacing:.2px}
.khqr-amount-row{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:6px}
.khqr-amount-num{font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:32px;font-weight:800;color:#1c2333;line-height:1}
.khqr-amount-cur{font-family:'Space Mono',monospace;font-size:11px;color:#8b93a3;font-weight:700;letter-spacing:.5px}
.khqr-divider{border-top:1px dashed rgba(28,35,51,.18);margin:16px 18px 0}
.khqr-qr-area{background:#fff;margin:16px 22px 0;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.khqr-qr-area img{width:100%!important;height:auto!important;max-width:100%!important;aspect-ratio:1/1;object-fit:contain;display:block;border-radius:4px}
.khqr-qr-loading{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#999;font-size:11px;font-family:'Space Mono','Noto Sans Khmer',monospace}
.qr-spinner{width:28px;height:28px;border:3px solid #f0f0f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pollBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.khqr-scan-label{text-align:center;font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:15px;font-weight:800;color:#1c2333;margin-top:14px}
.khqr-or{text-align:center;font-size:11px;color:#9aa1af;margin-top:4px;font-family:'Space Mono',monospace}
.khqr-download-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px auto 0;background:none;border:none;color:var(--green);font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:13.5px;font-weight:800;cursor:pointer}
.khqr-download-hint{text-align:center;font-size:10.5px;color:#9aa1af;line-height:1.6;margin:6px 18px 0;font-family:'Noto Sans Khmer',sans-serif}
.khqr-account{padding:14px 18px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'Space Mono',monospace;font-size:9.5px;color:#9aa1af}
.khqr-footer-bar{padding:10px 18px 16px;display:flex;justify-content:center}
.khqr-footer-bar span{font-family:'Space Mono',monospace;font-size:8px;color:#9aa1af;letter-spacing:.3px}


.section{padding:16px 16px 0}
.status-pill{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 14px;margin-bottom:10px}
.status-pill .lbl{font-size:11px;color:var(--text3);font-family:'Space Mono','Noto Sans Khmer',monospace}
.status-pill .lbl b{color:var(--gold);font-weight:700}
.status-pill .dot-wrap{font-size:10px;font-family:'Space Mono','Noto Sans Khmer',monospace;display:flex;align-items:center;gap:6px}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block;transition:background .3s;flex-shrink:0}

.deeplink-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-weight:800;font-size:13px;padding:12px;border-radius:12px;box-shadow:0 4px 16px rgba(245,200,66,.3);margin-bottom:8px}
.btn-secondary{width:100%;padding:12px;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}

/* Success state */
#state-success{display:none;animation:fadeInUp .3s ease}
.success-header{background:linear-gradient(135deg,#14532d,#166534);padding:28px 22px 24px;text-align:center;position:relative;overflow:hidden;border-radius:22px 22px 0 0;margin-top:18px}
.success-header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,rgba(34,197,94,.15),transparent 70%)}
.success-check{width:72px;height:72px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 30px rgba(34,197,94,.45);position:relative}
.success-title{font-family:'Syne','Noto Sans Khmer',sans-serif;font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
.success-sub{font-size:12px;color:rgba(255,255,255,.7)}
.success-body{background:var(--bg2);border-radius:0 0 22px 22px;padding:18px}
.section-label{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.section-label .bar{width:4px;height:16px;background:var(--gold);border-radius:99px;flex-shrink:0}
.section-label .txt{font-family:'Space Mono','Noto Sans Khmer',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.account-line{background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.account-line .idx{font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:4px}
.account-line .row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.account-line .val{font-size:13px;font-weight:700;color:var(--text);word-break:break-all;flex:1}
.copy-btn-sm{flex-shrink:0;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 9px;font-size:10.5px;color:var(--gold);display:flex;align-items:center;gap:4px}
.order-notice{font-size:11px;color:var(--text3);background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;margin:12px 0 14px;line-height:1.85;display:flex;align-items:flex-start;gap:8px}
.order-notice b{color:var(--gold);font-family:'Space Mono',monospace}
.tg-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#229ED9,#1a8fc0);color:#fff;font-weight:700;font-size:13px;margin-bottom:10px;box-shadow:0 4px 16px rgba(34,158,217,.3)}
.btn-primary{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}

.empty-state{padding:70px 24px;text-align:center;color:var(--text2);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty-state a{color:#000;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:12px 26px;border-radius:999px;font-weight:800;font-family:'Syne',sans-serif}

.toast{position:fixed;left:16px;right:16px;bottom:20px;z-index:200;padding:13px 16px;border-radius:14px;background:var(--bg3);color:var(--text);font-size:13px;text-align:center;font-weight:700;border:1px solid var(--border2);box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(120%);transition:transform .25s ease;max-width:408px;margin:0 auto}
.toast.show{transform:translateY(0)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.success{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<div id="page"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";
const ADMIN_TG = '@smos_sne1';

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg,kind){
  const t=$("#toast"); t.innerHTML=msg; t.className="toast show"+(kind?" "+kind:"");
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("show"),3200);
}
function uid(prefix){ return (prefix||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadState2(){
  try{ return JSON.parse(localStorage.getItem('kz_state2')||'null') || {products:[],stock:{},settings:{}}; }
  catch(e){ return {products:[],stock:{},settings:{}}; }
}
function saveState2(s){
  try{ localStorage.setItem('kz_state2', JSON.stringify(s)); }catch(e){ console.error('[saveState2]',e); }
}
function loadUserData(){
  try{ return JSON.parse(localStorage.getItem('kz_userdata')||'null') || {users:[],orders:[]}; }
  catch(e){ return {users:[],orders:[]}; }
}
function saveUserData(d){
  try{ localStorage.setItem('kz_userdata', JSON.stringify(d)); }catch(e){ console.error('[saveUserData]',e); }
}
function apiBase2(settingsObj){
  return ((settingsObj&&settingsObj.khqrUrl)||'').trim().replace(/\/+$/,'') || location.origin;
}
// Pull the shared settings straight from the server before rendering the QR —
// a customer landing here may never have visited index.html on this device,
// so the local kz_state2 cache can be completely empty otherwise.
async function fetchServerSettings(base){
  try{
    const res = await fetch(base + '/api/state2');
    if(!res.ok) return null;
    const d = await res.json();
    return d.ok ? d : null;
  }catch(e){ console.warn('[fetchServerSettings]', e); return null; }
}
// Ask the server to atomically hand out `qty` stock lines for a product.
// This — not a local array splice — is what stops two customers who pay at
// nearly the same moment from both being delivered the SAME account.
async function deliverStockFromServer(base, productId, qty){
  try{
    const res = await fetch(base + '/api/deliver-stock', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ productId, qty }),
    });
    const d = await res.json();
    return d.ok ? d.delivered : null;
  }catch(e){ console.warn('[deliverStockFromServer]', e); return null; }
}
function pushOrderToServer(base, order){
  const ud = loadUserData();
  ud.orders = ud.orders || [];
  ud.orders.unshift(order);
  saveUserData(ud);
  fetch(base + '/api/userdata', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(ud),
  }).catch(e => console.error('[pushOrderToServer]', e));
}

// ---- load handoff payload ----
const params = new URLSearchParams(location.search);
const orderId = params.get('order');
let payload = null;
try{ payload = orderId ? JSON.parse(sessionStorage.getItem('kz_checkout_'+orderId)||'null') : null; }catch(e){ payload=null; }

const page = $('#page');
if(!orderId || !payload){
  page.innerHTML = `<div class="empty-state">
    <div style="font-size:34px">⚠️</div>
    <div>រកមិនឃើញព័ត៌មានការទូទាត់នេះទេ (session ផុតកំណត់ ឬបានបើកទំព័រនេះដោយផ្ទាល់)</div>
    <a href="/">ត្រឡប់ទៅហាងវិញ</a>
  </div>`;
  return;
}

const s2 = loadState2();
let settings = s2.settings || {};
const tgUname = (settings.tgSupport || ADMIN_TG).replace('@','');
// Refresh settings/khqrUrl from the server in the background — a shopper can
// land on this checkout page without ever having loaded index.html on this
// device, so the local kz_state2 cache may be empty or stale.
fetchServerSettings(apiBase2(settings)).then(d => {
  if (d) { settings = { ...settings, ...d.settings }; saveState2({ ...s2, settings }); }
});

page.innerHTML = `
  <div class="topbar">
    <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>ត្រឡប់ក្រោយ</a>
  </div>

  <div class="section" id="state-qr">
    <div class="step-track">
      <div class="step-dot active" id="step1">1</div>
      <div class="step-line" id="line1"></div>
      <div class="step-dot" id="step2">2</div>
      <div class="step-line" id="line2"></div>
      <div class="step-dot" id="step3">3</div>
    </div>
    <div class="step-label">ស្កេន QR &nbsp;•&nbsp; កំពុងផ្ទៀងផ្ទាត់ &nbsp;•&nbsp; ជោគជ័យ</div>
    <div class="khqr-card">
      <div class="khqr-header">
        <div class="khqr-header-bar"></div>
        <div class="khqr-brand">KH<em>QR</em></div>
      </div>
      <div class="khqr-title-row">
        <div class="khqr-title">ទូទាត់ដោយ KHQR</div>
        <div class="khqr-timer" id="khqr-timer" title="ចុចដើម្បីបង្កើត QR ថ្មី">
          <svg class="khqr-timer-ring" viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="8"></circle><circle class="fg" id="khqr-timer-ring-fg" cx="10" cy="10" r="8" stroke-dasharray="50.24" stroke-dashoffset="0"></circle></svg>
          <span id="khqr-timer-txt">3:00</span>
        </div>
      </div>
      <div class="khqr-merchant-bar">
        <div class="khqr-merchant">${esc(settings.merchantName || 'Kairozen Store')}</div>
        <div class="khqr-amount-row">
          <span class="khqr-amount-num">${Number(payload.amount).toFixed(2)}</span>
          <span class="khqr-amount-cur">USD</span>
        </div>
      </div>
      <div class="khqr-divider"></div>
      <div class="khqr-qr-area"><div id="qr-area"><div class="khqr-qr-loading"><div class="qr-spinner"></div><span>Generating...</span></div></div></div>
      <div class="khqr-scan-label">Scan to pay</div>
      <div class="khqr-or">or</div>
      <button type="button" class="khqr-download-btn" id="khqr-download-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
        Download QR
      </button>
      <div class="khqr-download-hint">ហើយ upload ទៅកាន់ Mobile Banking app<br>ណាមួយដែលគាំទ្រ KHQR</div>
      <div class="khqr-account">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#9aa1af"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z"/></svg>
        <span>${esc(settings.bakongAccount || '')}</span>
      </div>
      <div class="khqr-footer-bar"><span>Powered by NBC · Bakong</span></div>
    </div>


    <div style="padding:14px 2px">
      <div class="status-pill">
        <div class="lbl">Order: <b>${esc(orderId)}</b></div>
        <div class="dot-wrap"><span class="dot" id="poll-dot"></span><span id="poll-label" style="color:var(--text3)">Waiting...</span></div>
      </div>
      <div id="deeplink-wrap" style="display:none">
        <a class="deeplink-btn" id="deeplink-btn" href="#" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z"/></svg>
          បើក ABA Mobile
        </a>
      </div>
      <button class="btn-secondary" id="cancelBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        Cancel
      </button>
    </div>
  </div>

  <div id="state-success">
    <div class="success-header">
      <div class="success-check"><svg width="38" height="38" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
      <div class="success-title">Payment Confirmed!</div>
      <div class="success-sub">គណនីអ្នកត្រូវបាន Deliver រួចហើយ!</div>
    </div>
    <div class="success-body">
      <div class="section-label"><span class="bar"></span><span class="txt">Delivered Accounts</span></div>
      <div id="delivery-lines"></div>
      <div id="copy-all-wrap" style="display:none;margin-bottom:10px">
        <button class="btn-secondary" id="copyAllBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          Copy All
        </button>
      </div>
      <div class="order-notice">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--gold)" style="flex-shrink:0;margin-top:1px"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span>សូម Save account info! · Order: <b>${esc(orderId)}</b></span>
      </div>
      <a class="tg-btn" href="https://t.me/${esc(tgUname)}" target="_blank">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-2.01 9.47c-.149.658-.54.818-1.094.508l-3-2.21-1.448 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.884.751z"/></svg>
        Chat Admin @${esc(tgUname)}
      </a>
      <button class="btn-primary" id="doneBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Done ✓
      </button>
    </div>
  </div>
`;

$('#cancelBtn').onclick = () => { silentPolling = false; location.href = '/'; };
$('#doneBtn').onclick = () => { toast('Thank you! Enjoy your account!','success'); setTimeout(()=>location.href='/', 900); };

function setPollStatus(st){
  const dot=$('#poll-dot'), lbl=$('#poll-label');
  const s1=$('#step1'), s2=$('#step2'), s3=$('#step3'), l1=$('#line1'), l2=$('#line2');
  if(dot&&lbl){
    dot.style.animation='none';
    if(st==='waiting'){ dot.style.background='var(--text3)'; lbl.textContent='Waiting...'; }
    else if(st==='polling'){ dot.style.background='var(--gold)'; lbl.textContent='Detecting payment...'; dot.style.animation='pollBlink 1s infinite'; }
    else if(st==='paid'){ dot.style.background='var(--green)'; lbl.textContent='Paid!'; }
  }
  if(s1&&s2&&s3&&l1&&l2){
    if(st==='waiting'){ s1.className='step-dot active'; s2.className='step-dot'; s3.className='step-dot'; l1.className='step-line'; l2.className='step-line'; }
    else if(st==='polling'){ s1.className='step-dot done'; s2.className='step-dot active'; s3.className='step-dot'; l1.className='step-line done'; l2.className='step-line'; }
    else if(st==='paid'){ s1.className='step-dot done'; s2.className='step-dot done'; s3.className='step-dot done'; l1.className='step-line done'; l2.className='step-line done'; }
  }
}

let silentPolling = false, pollAttempt = 0;
const POLL_MAX = 100, POLL_INTERVAL = 3000;

async function generateQR(){
  const qrArea = $('#qr-area');
  const url = (settings.khqrUrl || '').trim().replace(/\/+$/,'');
  try{
    const res = await fetch(url + '/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ account: settings.bakongAccount, name: settings.merchantName,
        city: settings.merchantCity, amount: parseFloat(payload.amount), currency:'USD', memo: orderId }),
      signal: AbortSignal.timeout(15000), mode:'cors',
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Server error');
    payload.md5 = data.md5;
    if(data.deeplink){
      const btn=$('#deeplink-btn'), wrap=$('#deeplink-wrap');
      if(btn&&wrap){ btn.href=data.deeplink; wrap.style.display='block'; }
    }
    if(data.img){
      const img = document.createElement('img');
      const raw = String(data.img).trim();
      img.src = /^(data:|https?:\/\/)/i.test(raw) ? raw : 'data:image/png;base64,' + raw;
      img.alt = 'KHQR';
      img.onerror = () => {
        // Primary image URL/data was bad — fall back to rendering the deeplink
        // itself as a scannable QR, so the customer always sees something.
        if (data.deeplink) {
          const fallback = document.createElement('img');
          fallback.alt = 'KHQR';
          fallback.src = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=' + encodeURIComponent(data.deeplink);
          qrArea.innerHTML = ''; qrArea.appendChild(fallback);
        } else {
          qrArea.innerHTML = `<div style="padding:20px;text-align:center;font-size:12px;color:#999">QR image failed to load — use the deeplink button below, or contact admin</div>`;
        }
      };
      qrArea.innerHTML=''; qrArea.appendChild(img);
    }
    setPollStatus('polling');
    pollAttempt = 0;
    if(data.md5){ silentPolling = true; silentPoll(data.md5); }
    startQrTimer();
  }catch(e){
    console.warn('[generateQR]', e.message);
    showOfflineFallback();
  }
}

// ══════════════════════════════════════
//  QR SESSION COUNTDOWN (visual, matches KHQR-style apps)
//  Auto-regenerates the QR when the session runs out; tapping
//  the timer badge at any time refreshes it early.
// ══════════════════════════════════════
const QR_SESSION_SECONDS = 180;
const QR_RING_CIRC = 50.24; // 2*PI*8
let qrTimerInterval = null, qrSecondsLeft = QR_SESSION_SECONDS;

function startQrTimer(){
  qrSecondsLeft = QR_SESSION_SECONDS;
  const badge = $('#khqr-timer');
  if (badge) badge.classList.remove('expired');
  renderQrTimer();
  if (qrTimerInterval) clearInterval(qrTimerInterval);
  qrTimerInterval = setInterval(() => {
    qrSecondsLeft--;
    if (qrSecondsLeft <= 0) {
      clearInterval(qrTimerInterval);
      qrSecondsLeft = 0;
      renderQrTimer();
      if (badge) badge.classList.add('expired');
      const qrArea = $('#qr-area');
      if (qrArea) qrArea.innerHTML = `<div class="khqr-qr-loading"><div class="qr-spinner"></div><span>Refreshing...</span></div>`;
      generateQR();
      return;
    }
    renderQrTimer();
  }, 1000);
}
function renderQrTimer(){
  const txt = $('#khqr-timer-txt'), ring = $('#khqr-timer-ring-fg');
  if (txt) {
    const m = Math.floor(qrSecondsLeft/60), s = qrSecondsLeft%60;
    txt.textContent = m + ':' + String(s).padStart(2,'0');
  }
  if (ring) {
    const frac = qrSecondsLeft / QR_SESSION_SECONDS;
    ring.setAttribute('stroke-dashoffset', String(QR_RING_CIRC * (1 - frac)));
  }
}
function downloadQrImage(){
  const img = document.querySelector('#qr-area img');
  if (!img) { toast('QR មិនទាន់ត្រៀមខ្លួន', 'error'); return; }
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'KHQR-' + orderId + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function showOfflineFallback(){
  const acct = (settings.bakongAccount||'').trim();
  const qrArea = $('#qr-area');
  if(!acct){
    qrArea.innerHTML = `<div style="padding:20px;text-align:center;font-size:12px;color:#999;line-height:1.8">⚙️<br>Admin: configure<br><strong>Bakong Account</strong><br>in Settings</div>`;
    setPollStatus('waiting'); toast('Server offline — contact admin','error'); return;
  }
  const deeplink = `https://bakong.nbc.gov.kh/link/${encodeURIComponent(acct)}?amount=${parseFloat(payload.amount).toFixed(2)}&currency=USD&memo=${encodeURIComponent(orderId)}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=${encodeURIComponent(deeplink)}`;
  const img = document.createElement('img');
  img.style.cssText='width:100%;height:auto;display:block;border-radius:6px';
  img.onload = () => { qrArea.innerHTML=''; qrArea.appendChild(img); };
  img.onerror = () => { qrArea.innerHTML = `<div style="padding:14px;text-align:center;font-size:11px;color:#666">QR failed<br><a href="${deeplink}" style="color:#c9960a" target="_blank">Open Bakong</a></div>`; };
  img.src = qrUrl;
  const btn=$('#deeplink-btn'), wrap=$('#deeplink-wrap');
  if(btn&&wrap){ btn.href=deeplink; wrap.style.display='block'; }
  setPollStatus('waiting');
  toast('⚠️ Server offline — QR offline · Manual confirm needed','error');
  startQrTimer();
}

async function silentPoll(md5){
  if(!silentPolling) return;
  pollAttempt++;
  if(pollAttempt > POLL_MAX){ silentPolling=false; setPollStatus('waiting'); return; }
  try{
    const url = (settings.khqrUrl||'').trim().replace(/\/+$/,'');
    const res = await fetch(url+'/check_payment', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({md5}), signal: AbortSignal.timeout(8000), mode:'cors',
    });
    const data = await res.json();
    if(data.paid){ silentPolling=false; setPollStatus('paid'); setTimeout(showSuccess, 400); return; }
  }catch(e){ console.warn('[poll]', e.message); }
  setTimeout(() => silentPoll(md5), POLL_INTERVAL);
}

async function showSuccess(){
  const base = apiBase2(settings);
  // Prefer the server's live catalog to decide delivery type + product name —
  // the local cache may not even know about this product on this device.
  const serverCat = await fetchServerSettings(base);
  const data = serverCat ? { products: serverCat.products, stock: serverCat.stock, settings } : loadState2();
  const p = (data.products||[]).find(x => x.id === payload.productId) || {};
  let delivered = null;
  if(p.delivery === 'auto'){
    // Atomic server-side pop — guarantees two near-simultaneous buyers never
    // get handed the same account, which a local array splice cannot.
    delivered = await deliverStockFromServer(base, p.id, payload.qty);
    if(!delivered){
      // Server unreachable / genuinely out of stock — fall back to the local
      // cache so the customer isn't stuck, but this delivery won't be
      // reflected on other devices until the next successful sync.
      const local = loadState2();
      const arr = (local.stock[p.id] || []).filter(x => x.trim());
      delivered = arr.splice(0, payload.qty);
      local.stock[p.id] = arr;
      saveState2(local);
    }
  } else {
    delivered = ['[Manual — Admin will send via Telegram]'];
  }
  const newOrder = { id: orderId, productId: p.id, productName: p.name || payload.productName,
    customerName: payload.customerName, username: payload.username,
    amount: payload.amount, qty: payload.qty, status: 'completed', accounts: delivered, ts: Date.now() };
  pushOrderToServer(base, newOrder);

  const copySvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
  $('#delivery-lines').innerHTML = delivered.map((acc,i) => `
    <div class="account-line">
      <div class="idx">Account ${i+1}</div>
      <div class="row">
        <div class="val">${esc(acc)}</div>
        <button class="copy-btn-sm" data-acc="${esc(acc)}">${copySvg} Copy</button>
      </div>
    </div>`).join('');
  document.querySelectorAll('.copy-btn-sm').forEach(btn => {
    btn.onclick = () => navigator.clipboard.writeText(btn.dataset.acc).then(() => toast('Copied!','success'));
  });
  window._lastDelivered = delivered;
  $('#copy-all-wrap').style.display = delivered.length > 1 ? 'block' : 'none';

  $('#state-qr').style.display = 'none';
  $('#state-success').style.display = '';

  sendTelegramNotification(newOrder);
}

$('#copyAllBtn') && ($('#copyAllBtn').onclick = () => {
  navigator.clipboard.writeText((window._lastDelivered||[]).join('\n')).then(() => toast('All copied!','success'));
});

async function sendTelegramNotification(order){
  const { tgToken, tgChat } = settings;
  if(!tgToken || !tgChat) return;
  const accs = (order.accounts||[]).filter(a=>!a.startsWith('[')).join('\n') || 'Manual delivery';
  const msg = `New Order!\nID: ${order.id}\nProduct: ${order.productName} x${order.qty}\nUser: ${order.customerName} (@${order.username||'—'})\nAmount: $${order.amount}\nDelivered:\n${accs}`;
  try{ await fetch('https://api.telegram.org/bot'+tgToken+'/sendMessage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chat_id:tgChat, text:msg})}); }catch(e){}
}

setPollStatus('waiting');
$('#khqr-download-btn') && ($('#khqr-download-btn').onclick = downloadQrImage);
$('#khqr-timer') && ($('#khqr-timer').onclick = () => { if (qrTimerInterval) clearInterval(qrTimerInterval); qrSecondsLeft = 0; renderQrTimer(); $('#khqr-timer').classList.add('expired'); $('#qr-area').innerHTML = `<div class="khqr-qr-loading"><div class="qr-spinner"></div><span>Refreshing...</span></div>`; generateQR(); });
generateQR();

})();
</script>
