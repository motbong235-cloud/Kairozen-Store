# ==========================================================
# Example server block wiring the zones from ddos-limits.conf.
# Install at: /etc/nginx/sites-available/app, then:
#   ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
# Adjust server_name, TLS block, and upstream port (8000) to match yours.
# ==========================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # <-- change me

    # ---- Slowloris / slow-client protection ----
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s 15s;
    send_timeout          10s;
    reset_timedout_connection on;

    # ---- Request size / header limits ----
    client_max_body_size 2m;              # raise if you accept file uploads
    large_client_header_buffers 4 8k;

    # ---- Reject bad methods / known-bad bots up front, cheaply ----
    if ($bad_method) { return 405; }
    if ($bad_bot)    { return 403; }

    access_log /var/log/nginx/app_access.log ddos_log;
    error_log  /var/log/nginx/app_error.log warn;

    # ---- Connection + rate limits ----
    limit_conn conn_per_ip 20;
    limit_conn conn_per_server 2000;
    limit_req  zone=req_general burst=20 nodelay;

    # Tighter limit on auth/checkout-style endpoints — adjust paths to match your app
    location ~ ^/(api/auth|api/login|api/checkout)/ {
        limit_req zone=req_sensitive burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_ddos.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_ddos.conf;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_ddos.conf;
    }
}
