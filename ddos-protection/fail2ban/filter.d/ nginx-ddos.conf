# Install at: /etc/fail2ban/filter.d/nginx-ddos.conf
# Matches Nginx access log lines (using the `ddos_log` format from
# ddos-limits.conf) where the response status was 429 (rate-limited) or
# 403 (bad bot / hard-blocked).
[Definition]
failregex = ^<HOST> - \S+ \[.*\] "\S+ .*" (429|403) .*$
ignoreregex =
