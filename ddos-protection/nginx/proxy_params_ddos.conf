# Install at: /etc/nginx/proxy_params_ddos.conf
# `include` this from any location{} block that proxy_passes to the app,
# instead of the stock proxy_params, to add short upstream timeouts.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Short timeouts so a slow/stuck upstream can't be used to pile up
# connections on the Nginx side either.
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    10s;
