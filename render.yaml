services:
  - type: web
    name: kairozen-store
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: RIELPAY_API_KEY
        sync: false
      - key: RIELPAY_WEBHOOK_SECRET
        sync: false
      - key: KHMER_TOPUP_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: kairozen-data
      mountPath: /var/data
      sizeGB: 1
