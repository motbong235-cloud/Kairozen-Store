# Install at: /etc/fail2ban/jail.d/nginx-ddos.conf
# Bans IPs that repeatedly hit rate-limit (429) or bad-bot (403) responses,
# into the SAME `ddos_blacklist` ipset that firewall/setup-ipset-iptables.sh
# creates and firewall/ban_ip.sh writes to — so app-triggered bans and
# fail2ban-triggered bans are enforced by one consistent set of rules.
[nginx-ddos]
enabled  = true
port     = http,https
filter   = nginx-ddos
logpath  = /var/log/nginx/app_access.log
findtime = 60
maxretry = 15
bantime  = 3600
action   = iptables-ipset-proto4[name=ddos_blacklist, port="http,https", protocol=tcp]
