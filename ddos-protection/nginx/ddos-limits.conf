# ==========================================================
# DDoS Protection — HTTP-level rate/connection limit zones
# Install at: /etc/nginx/conf.d/ddos-limits.conf
# Loaded automatically by nginx.conf's `include /etc/nginx/conf.d/*.conf;`
# inside the http {} block — do NOT put this inside a server{} block.
# ==========================================================

# ---- Rate limiting zones (per client IP) ----
# General traffic: 10 req/s per IP, 10MB shared state (~160k tracked IPs)
limit_req_zone $binary_remote_addr zone=req_general:10m rate=10r/s;

# Stricter limit for sensitive endpoints (login, register, checkout, search)
limit_req_zone $binary_remote_addr zone=req_sensitive:10m rate=2r/s;

# ---- Connection limiting zones ----
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name zone=conn_per_server:10m;

# Return 429 instead of the default 500-ish error, with a short body
limit_req_status 429;
limit_conn_status 429;

# ---- Log format that captures limiting/blocking events ----
# Used by both monitor.py and the fail2ban filter — keep the field order
# stable if you edit this.
log_format ddos_log '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time';

# ---- Known bad / scanner User-Agents ----
# Review this list for your own traffic before enabling in production —
# python-requests/Go-http-client/curl are also used by legitimate webhook
# callers and monitoring tools, so only block them if you know you don't
# need to accept requests from tools identifying themselves this way.
map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|acunetix|nessus|masscan|zgrab|nmap|libwww-perl|havij) 1;
    ""  1;   # an empty User-Agent is very commonly a script, not a browser
}

# ---- Reject abnormal HTTP methods used mostly by scanners ----
map $request_method $bad_method {
    default 0;
    TRACE   1;
    CONNECT 1;
}
